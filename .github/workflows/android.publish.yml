name: Publish @notesnook/android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      NDK_CCACHE: ccache
      USE_CCACHE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node
        uses: ./.github/actions/setup-node-with-cache

      - name: Use specific Java version for the builds
        uses: joschi/setup-jdk@v2
        with:
          java-version: "17"
          architecture: "x64"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install node modules
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile

      - name: Make Gradlew Executable
        run: cd apps/mobile/android && chmod +x ./gradlew

      - name: Install CCache
        uses: hendrikmuhs/ccache-action@v1.2.11
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          max-size: 1500M
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup CCache
        run: |
          ln -s $(which ccache) /usr/local/bin/gcc
          ln -s $(which ccache) /usr/local/bin/g++
          ln -s $(which ccache) /usr/local/bin/cc
          ln -s $(which ccache) /usr/local/bin/c++
          ln -s $(which ccache) /usr/local/bin/clang
          ln -s $(which ccache) /usr/local/bin/clang++
          ccache --set-config=base_dir=$PWD
          ccache --set-config=inode_cache=true
          ccache --set-config=compiler_check=content
          ccache --set-config=depend_mode=true
          ccache --set-config=file_clone=true
          ccache --set-config=sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          ccache -p

      - name: Cache gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Patch CPP Projects to use CCache
        run: |
          sed -i -e 's/arguments/arguments "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",/g' apps/mobile/node_modules/react-native-mmkv-storage/android/build.gradle
          sed -i -e 's/arguments/arguments "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",/g' apps/mobile/node_modules/react-native-reanimated/android/build.gradle

      - name: CCache Stats Before Build
        run: ccache -sv

      - name: Check for typescript errors
        run: |
          npm run tx mobile:build
          cd apps/mobile
          npx tsc --noEmit

      - name: Remove debug keystore
        run: rm -rf apps/mobile/android/app/debug.keystore

      # ❌ AAB build not required
      # - name: Build unsigned app bundle
      #   run: yarn release:android:bundle

      # ✅ Build UNSIGNED arm64-v8a APK ONLY
      - name: Build unsigned arm64-v8a APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: CCache Stats after build
        run: ccache -sv

      # ❌ No signing (bundle)
      # - name: Sign app bundle for Playstore release
      #   uses: r0adkll/sign-android-release@master

      # ❌ No multi-APK build
      # - name: Build apks for Github release
      #   run: yarn release:android

      # ❌ No APK signing
      # - name: Sign apk files
      #   uses: r0adkll/sign-android-release@master

      # ❌ No renaming / other ABIs
      # - name: Rename apk files
      #   run: ...

      # ❌ No Play Store upload
      # - name: Publish to Playstore
      #   uses: r0adkll/upload-google-play@v1.1.1

      # ❌ No GitHub release
      # - name: Create release draft on Github
      #   uses: softprops/action-gh-release@v1

      # ✅ Upload ONLY unsigned arm64-v8a APK as artifact
      - name: Upload arm64-v8a unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: notesnook-android-arm64-v8a-unsigned
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*arm64-v8a*-unsigned.apk

      # ❌ Optional: remove sourcemaps if not needed
      # - name: Upload sourcemaps
      #   uses: actions/upload-artifact@v4
