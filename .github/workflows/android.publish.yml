name: Publish @notesnook/android (unsigned universal APK)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      NDK_CCACHE: ccache
      USE_CCACHE: 1

    steps:
      # --------------------------------------------------
      # Checkout & environment
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node
        uses: ./.github/actions/setup-node-with-cache

      - name: Setup Java 17
        uses: joschi/setup-jdk@v2
        with:
          java-version: "17"
          architecture: "x64"

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # --------------------------------------------------
      # Node / RN bootstrap
      # --------------------------------------------------
      - name: Install node modules
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile

      - name: Make Gradlew executable
        run: cd apps/mobile/android && chmod +x ./gradlew

      # --------------------------------------------------
      # CCache & Gradle cache (performance only)
      # --------------------------------------------------
      - name: Install CCache
        uses: hendrikmuhs/ccache-action@v1.2.11
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          max-size: 1500M
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup CCache
        run: |
          ln -s $(which ccache) /usr/local/bin/gcc || true
          ln -s $(which ccache) /usr/local/bin/g++ || true
          ln -s $(which ccache) /usr/local/bin/cc || true
          ln -s $(which ccache) /usr/local/bin/c++ || true
          ln -s $(which ccache) /usr/local/bin/clang || true
          ln -s $(which ccache) /usr/local/bin/clang++ || true
          ccache --set-config=base_dir=$PWD
          ccache --set-config=inode_cache=true
          ccache --set-config=compiler_check=content
          ccache -p || true

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # --------------------------------------------------
      # Sanity checks
      # --------------------------------------------------
      - name: TypeScript check
        run: |
          npm run tx mobile:build
          cd apps/mobile
          npx tsc --noEmit

      - name: Remove debug keystore (force unsigned)
        run: rm -rf apps/mobile/android/app/debug.keystore || true

      # --------------------------------------------------
      # BUILD: UNIVERSAL UNSIGNED APK
      # --------------------------------------------------
      - name: Build unsigned universal release APK
        run: |
          cd apps/mobile/android
          ./gradlew clean assembleRelease

      # --------------------------------------------------
      # DISCOVER: find where APK actually is
      # --------------------------------------------------
      - name: Debug: list APK outputs
        run: |
          echo "=== APK files found ==="
          find apps/mobile/android/app/build/outputs/apk -type f -name "*.apk" -print

      # --------------------------------------------------
      # UPLOAD: guaranteed artifact capture
      # --------------------------------------------------
      - name: Upload unsigned universal APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notesnook-android-universal-unsigned
          path: |
            apps/mobile/android/app/build/outputs/apk/release/**/*.apk