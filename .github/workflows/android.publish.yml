name: Publish @notesnook/android (unsigned universal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------
      # Checkout source
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Set up Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Set up Node (React Native)
      # --------------------------------------------------
      - name: Set up Node
        uses: ./.github/actions/setup-node-with-cache

      # --------------------------------------------------
      # Free up space (optional, safe)
      # --------------------------------------------------
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # --------------------------------------------------
      # Install JS dependencies
      # --------------------------------------------------
      - name: Install node modules
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile

      # --------------------------------------------------
      # Android SDK installation (official workflow style)
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      # --------------------------------------------------
      # Prepare Gradle
      # --------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Remove debug keystore
        run: rm -f apps/mobile/android/app/debug.keystore || true

      # --------------------------------------------------
      # Build (unsigned universal release)
      # --------------------------------------------------
      - name: Build unsigned universal APK
        run: |
          cd apps/mobile/android
          ./gradlew clean assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g"

      # --------------------------------------------------
      # Debug: check where APK was created
      # --------------------------------------------------
      - name: Locate built APKs
        run: |
          echo "Listing all APKs under outputs:"
          find apps/mobile/android/app/build/outputs/apk -type f -name "*.apk" -print

      # --------------------------------------------------
      # Upload as artifact
      # --------------------------------------------------
      - name: Upload unsigned universal APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notesnook-release-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/**/*.apk