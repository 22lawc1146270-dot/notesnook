name: Publish @notesnook/android (unsigned universal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java (required by Android)
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Node (required by React Native / Notesnook)
      # --------------------------------------------------
      - name: Set up Node
        uses: ./.github/actions/setup-node-with-cache

      # --------------------------------------------------
      # Free disk space (safe)
      # --------------------------------------------------
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # --------------------------------------------------
      # Install JS dependencies
      # --------------------------------------------------
      - name: Install node modules
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile

      # --------------------------------------------------
      # Android SDK + licenses
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # --------------------------------------------------
      # Prepare Gradle
      # --------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Remove debug keystore (force unsigned)
        run: rm -f apps/mobile/android/app/debug.keystore

      # --------------------------------------------------
      # BUILD: unsigned universal APK
      # --------------------------------------------------
      - name: Build unsigned universal APK
        run: |
          cd apps/mobile/android
          ./gradlew clean assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      # --------------------------------------------------
      # DISCOVER: show exactly where APK is
      # --------------------------------------------------
      - name: Locate built APK
        run: |
          echo "APK files found:"
          find apps/mobile/android/app/build/outputs/apk -type f -name "*.apk" -print

      # --------------------------------------------------
      # UPLOAD: guaranteed artifact
      # --------------------------------------------------
      - name: Upload unsigned universal APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notesnook-release-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/**/*.apk